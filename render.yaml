services:
  - type: web
    name: whatsapp-service
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: BASE44_APP_ID
        sync: false
      - key: BASE44_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: whatsapp-redis
          property: connectionString

databases:
  - type: redis
    name: whatsapp-redis
    plan: free
